; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:0AksesRegister]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
build_src_filter = -<*> +<0.Akses_Register.cpp>

[env:1MACAddress]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
build_src_filter = -<*> +<1.MAC_Address.cpp>

[env:2KecepatanOutputDigitalArduinoLib]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
build_src_filter = -<*> +<2.Kecepatan_Output_Digital_ArduinoLib.cpp>
board_build.f_cpu = 240000000L

[env:2KecepatanOutputDigitalRegister]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
build_src_filter = -<*> +<2.Kecepatan_Output_Digital_Register.cpp>